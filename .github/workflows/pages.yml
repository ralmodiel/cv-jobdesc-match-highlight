# Checks, then deploys dist/ to GitHub Pages. Actions are pinned to commit SHAs (tag in the comment).
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cut a deploy short
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models
          key: model-${{ hashFiles('scripts/fetch-assets.mjs') }}
      - run: npm ci
      - run: npm run assets
      - run: npm run check:deps
      - run: npm run check # unit, browser and e2e (builds dist/); uses the runner's Chrome
      - run: npx playwright-core install --with-deps firefox webkit
      - run: BROWSER=firefox node scripts/check-e2e.mjs && BROWSER=webkit node scripts/check-e2e.mjs # the same e2e in Firefox and Safari's engine
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
